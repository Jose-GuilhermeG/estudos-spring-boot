<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-sm">

    <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Bem-vindo de volta!</h1>
        <p class="text-sm text-gray-500 mt-1">Entre com sua conta para continuar</p>
    </div>

    <form class="space-y-4" method="post" th:action="@{/login}">

        <div>
            <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Nome</label>
            <input
                    type="text"
                    id="username"
                    placeholder="seu nome"
                    name="username"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                    required
            >
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="••••••••"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                    required
            >
        </div>

        <div class="flex items-center justify-between text-sm">
            <label class="flex items-center text-gray-600">
                <input type="checkbox" class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 mr-2">
                Lembrar-me
            </label>
            <a href="#" class="text-indigo-600 hover:underline">Esqueceu a senha?</a>
        </div>

        <button
                type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition duration-200 shadow-md hover:shadow-lg">
            Entrar
        </button>

    </form>

    <p class="text-center text-sm text-gray-600 mt-6">
        Não tem uma conta?
        <a href="#" class="text-indigo-600 font-medium hover:underline">Cadastre-se</a>
    </p>

</div>

</body>
</html>
